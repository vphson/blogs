name: Deploy

on:
  push:
    branches: [main, 001-personal-blog]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      # Deploy to Vercel (uncomment and configure if using Vercel)
      # - uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: '--prod'

      # Deploy to other platforms (add your deployment commands here)
      # Example for generic deployment:
      - name: Deploy to Production
        run: |
          echo "Add your deployment commands here"
          # Example:
          # - Deploy to Vercel: vercel --prod --token=$VERCEL_TOKEN
          # - Deploy to Netlify: netlify deploy --prod
          # - Deploy to your own server: rsync -avz out/ user@server:/path/to/app

      - name: Notify deployment success
        if: success()
        run: echo "Deployment successful!"
