# Codecov configuration
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        informational: true
    patch:
      default:
        target: 75%
        threshold: 1%
        informational: true

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tests/**"
  - "**/*.d.ts"
  - "**/*.config.*"
  - "**/mocks/**"
  - ".next/"
  - "coverage/"
  - "supabase/"
  - "specs/"
  - ".specstory/"
