openapi: 3.0.3
info:
  title: Blog Posts API
  description: API for managing blog posts
  version: 1.0.0

paths:
  /api/posts:
    get:
      summary: List posts
      description: Retrieve a paginated list of posts
      tags:
        - Posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: status
          in: query
          description: Filter by status (admin only)
          schema:
            type: string
            enum: [DRAFT, PUBLISHED]
        - name: category
          in: query
          description: Filter by category slug
          schema:
            type: string
        - name: search
          in: query
          description: Search in title and content
          schema:
            type: string
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

    post:
      summary: Create post
      description: Create a new post (admin only)
      tags:
        - Posts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get post by ID
      description: Retrieve a single post
      tags:
        - Posts
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          description: Post not found

    put:
      summary: Update post
      description: Update an existing post (admin only)
      tags:
        - Posts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Post not found

    delete:
      summary: Delete post
      description: Soft delete a post (admin only)
      tags:
        - Posts
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Post deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Post not found

  /api/posts/slug/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get post by slug
      description: Retrieve a post by its URL slug
      tags:
        - Posts
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          description: Post not found

  /api/posts/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      summary: Publish post
      description: Change post status to PUBLISHED (admin only)
      tags:
        - Posts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Post published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Unauthorized
        '404':
          description: Post not found

  /api/posts/{id}/unpublish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      summary: Unpublish post
      description: Change post status to DRAFT (admin only)
      tags:
        - Posts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Post unpublished successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Unauthorized
        '404':
          description: Post not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              slug:
                type: string

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          properties:
            content:
              type: string
            author:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string

    PostCreate:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 200
        slug:
          type: string
          description: Optional, auto-generated if not provided
        content:
          type: string
        excerpt:
          type: string
          maxLength: 500
        coverImage:
          type: string
          format: uri
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
          description: Array of category IDs to assign

    PostUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 200
        slug:
          type: string
        content:
          type: string
        excerpt:
          type: string
          maxLength: 500
        coverImage:
          type: string
          format: uri
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
